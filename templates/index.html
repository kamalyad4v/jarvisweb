<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S.</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --cyan: #00d4ff;
  --cyan-dim: #0099bb;
  --cyan-glow: rgba(0, 212, 255, 0.15);
  --cyan-glow-strong: rgba(0, 212, 255, 0.35);
  --red: #ff3860;
  --gold: #ffd700;
  --bg: #020a0f;
  --bg2: #041018;
  --bg3: #061520;
  --border: rgba(0, 212, 255, 0.2);
  --border-bright: rgba(0, 212, 255, 0.6);
  --text: #c8eef7;
  --text-dim: rgba(200, 238, 247, 0.5);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Share Tech Mono', monospace;
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── Animated grid background ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at 50% 0%, rgba(0,212,255,0.08) 0%, transparent 60%),
              radial-gradient(ellipse at 0% 100%, rgba(0,100,200,0.06) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* ── Header ── */
header {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 32px;
  border-bottom: 1px solid var(--border);
  background: rgba(2, 10, 15, 0.9);
  backdrop-filter: blur(10px);
  flex-shrink: 0;
}

.logo {
  display: flex;
  align-items: center;
  gap: 14px;
}

.arc-reactor {
  width: 38px;
  height: 38px;
  position: relative;
  flex-shrink: 0;
}
.arc-reactor svg { width: 100%; height: 100%; }

.logo-text h1 {
  font-family: 'Orbitron', monospace;
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 6px;
  color: var(--cyan);
  text-shadow: 0 0 20px var(--cyan);
  line-height: 1;
}
.logo-text p {
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--text-dim);
  margin-top: 3px;
  text-transform: uppercase;
}

.header-stats {
  display: flex;
  gap: 24px;
}
.stat {
  text-align: right;
}
.stat-label {
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--text-dim);
  text-transform: uppercase;
}
.stat-value {
  font-family: 'Orbitron', monospace;
  font-size: 13px;
  color: var(--cyan);
  text-shadow: 0 0 10px var(--cyan-dim);
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 12px var(--cyan);
  animation: pulse 2s ease-in-out infinite;
  display: inline-block;
  margin-right: 6px;
}

@keyframes pulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 12px var(--cyan); }
  50% { opacity: 0.4; box-shadow: 0 0 4px var(--cyan); }
}

/* ── Main layout ── */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
  position: relative;
  z-index: 1;
  height: calc(100vh - 72px);
}

/* ── Sidebar ── */
.sidebar {
  width: 220px;
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  padding: 20px 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow-y: auto;
}

.sidebar-section {
  padding: 0 16px;
  margin-bottom: 8px;
}

.sidebar-label {
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--text-dim);
  text-transform: uppercase;
  margin-bottom: 8px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}

.quick-btn {
  width: 100%;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  padding: 8px 12px;
  text-align: left;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.quick-btn:hover {
  border-color: var(--cyan);
  color: var(--cyan);
  background: var(--cyan-glow);
  text-shadow: 0 0 8px var(--cyan-dim);
}
.quick-btn .icon { font-size: 13px; }

.sys-info {
  margin-top: auto;
  padding: 16px;
  border-top: 1px solid var(--border);
}
.sys-line {
  font-size: 10px;
  color: var(--text-dim);
  margin-bottom: 4px;
  display: flex;
  justify-content: space-between;
}
.sys-line span:last-child { color: var(--cyan); }

/* ── Chat area ── */
.chat-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 24px 32px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Welcome screen */
.welcome {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  gap: 20px;
  padding: 40px;
  text-align: center;
}

.welcome-arc {
  width: 80px;
  height: 80px;
  animation: spin-slow 8s linear infinite;
}
@keyframes spin-slow {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.welcome h2 {
  font-family: 'Orbitron', monospace;
  font-size: 28px;
  font-weight: 900;
  letter-spacing: 8px;
  color: var(--cyan);
  text-shadow: 0 0 30px var(--cyan), 0 0 60px rgba(0,212,255,0.3);
}
.welcome p {
  color: var(--text-dim);
  font-size: 13px;
  letter-spacing: 2px;
  max-width: 400px;
  line-height: 1.8;
}

.welcome-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-top: 8px;
}

.chip {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  padding: 6px 14px;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.5px;
}
.chip:hover {
  border-color: var(--cyan);
  color: var(--cyan);
  background: var(--cyan-glow);
}

/* Message bubbles */
.message {
  display: flex;
  gap: 14px;
  animation: msg-in 0.3s ease-out;
  max-width: 100%;
}
@keyframes msg-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.message.user { flex-direction: row-reverse; }

.msg-avatar {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  background: var(--bg2);
}

.message.user .msg-avatar {
  border-color: rgba(255,216,0,0.3);
  color: var(--gold);
}

.msg-body { max-width: calc(100% - 48px); }

.msg-label {
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--text-dim);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.message.user .msg-label { text-align: right; color: rgba(255,216,0,0.5); }

.msg-content {
  background: var(--bg2);
  border: 1px solid var(--border);
  padding: 14px 18px;
  font-size: 13px;
  line-height: 1.7;
  color: var(--text);
  position: relative;
}

.message.user .msg-content {
  background: rgba(255,216,0,0.04);
  border-color: rgba(255,216,0,0.15);
  color: rgba(255,216,0,0.9);
}

.msg-content::before {
  content: '';
  position: absolute;
  top: -1px; left: -1px;
  width: 12px; height: 12px;
  border-top: 2px solid var(--cyan);
  border-left: 2px solid var(--cyan);
}
.msg-content::after {
  content: '';
  position: absolute;
  bottom: -1px; right: -1px;
  width: 12px; height: 12px;
  border-bottom: 2px solid var(--cyan-dim);
  border-right: 2px solid var(--cyan-dim);
}
.message.user .msg-content::before { border-color: rgba(255,216,0,0.4); }
.message.user .msg-content::after { border-color: rgba(255,216,0,0.2); }

/* Code blocks */
.msg-content pre {
  background: rgba(0,0,0,0.5);
  border: 1px solid var(--border);
  border-left: 3px solid var(--cyan);
  padding: 14px;
  overflow-x: auto;
  margin: 10px 0;
  font-family: 'Share Tech Mono', monospace;
  font-size: 12px;
  line-height: 1.6;
  color: #7ee8fa;
}

.msg-content code {
  background: rgba(0,212,255,0.08);
  padding: 1px 5px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 12px;
  color: var(--cyan);
  border: 1px solid rgba(0,212,255,0.15);
}

.msg-content pre code {
  background: none;
  border: none;
  padding: 0;
  color: #7ee8fa;
}

/* Typing indicator */
.typing-indicator {
  display: flex;
  gap: 14px;
  align-items: flex-start;
}
.typing-dots {
  background: var(--bg2);
  border: 1px solid var(--border);
  padding: 14px 18px;
  display: flex;
  gap: 5px;
  align-items: center;
}
.typing-dots span {
  width: 6px; height: 6px;
  background: var(--cyan);
  border-radius: 50%;
  animation: bounce 1.2s ease-in-out infinite;
  box-shadow: 0 0 6px var(--cyan);
}
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-6px); opacity: 1; }
}

/* ── Input area ── */
.input-area {
  border-top: 1px solid var(--border);
  padding: 20px 32px;
  background: rgba(2, 10, 15, 0.95);
  backdrop-filter: blur(10px);
  flex-shrink: 0;
}

.input-wrapper {
  display: flex;
  gap: 12px;
  align-items: flex-end;
  position: relative;
}

.input-wrapper::before {
  content: '>';
  color: var(--cyan);
  font-family: 'Orbitron', monospace;
  font-size: 14px;
  font-weight: 700;
  padding-bottom: 14px;
  text-shadow: 0 0 10px var(--cyan);
  flex-shrink: 0;
}

textarea {
  flex: 1;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-bottom: 2px solid var(--cyan-dim);
  color: var(--text);
  font-family: 'Share Tech Mono', monospace;
  font-size: 13px;
  padding: 12px 16px;
  resize: none;
  outline: none;
  min-height: 46px;
  max-height: 140px;
  line-height: 1.5;
  letter-spacing: 0.3px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
textarea:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 0 1px var(--cyan-dim), 0 0 20px var(--cyan-glow);
}
textarea::placeholder { color: var(--text-dim); }

.send-btn {
  width: 46px;
  height: 46px;
  background: transparent;
  border: 1px solid var(--cyan-dim);
  color: var(--cyan);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
  position: relative;
}
.send-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--cyan-glow);
  opacity: 0;
  transition: opacity 0.2s;
}
.send-btn:hover {
  border-color: var(--cyan);
  box-shadow: 0 0 20px var(--cyan-glow-strong);
}
.send-btn:hover::before { opacity: 1; }
.send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

.clear-btn {
  width: 46px;
  height: 46px;
  background: transparent;
  border: 1px solid rgba(255,56,96,0.3);
  color: rgba(255,56,96,0.6);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}
.clear-btn:hover {
  border-color: var(--red);
  color: var(--red);
  box-shadow: 0 0 16px rgba(255,56,96,0.2);
}

.input-hint {
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 1px;
  margin-top: 8px;
  padding-left: 20px;
}

/* ── Scanning line effect ── */
@keyframes scan {
  0% { top: -2px; }
  100% { top: 100%; }
}
.scan-line {
  position: fixed;
  left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(0,212,255,0.08), transparent);
  animation: scan 6s linear infinite;
  pointer-events: none;
  z-index: 100;
}

/* Scrollbar */
.sidebar::-webkit-scrollbar { width: 3px; }
.sidebar::-webkit-scrollbar-track { background: transparent; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border); }
</style>
</head>
<body>

<div class="scan-line"></div>

<!-- Header -->
<header>
  <div class="logo">
    <div class="arc-reactor">
      <svg viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="19" cy="19" r="17" stroke="#00d4ff" stroke-width="0.8" opacity="0.4"/>
        <circle cx="19" cy="19" r="13" stroke="#00d4ff" stroke-width="0.8" opacity="0.6"/>
        <circle cx="19" cy="19" r="8" stroke="#00d4ff" stroke-width="1.5" opacity="0.9"
          style="filter:drop-shadow(0 0 4px #00d4ff)"/>
        <circle cx="19" cy="19" r="4" fill="#00d4ff" opacity="0.9"
          style="filter:drop-shadow(0 0 8px #00d4ff)"/>
        <line x1="19" y1="2" x2="19" y2="7" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
        <line x1="19" y1="31" x2="19" y2="36" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
        <line x1="2" y1="19" x2="7" y2="19" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
        <line x1="31" y1="19" x2="36" y2="19" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
        <animateTransform attributeName="transform" type="rotate" from="0 19 19" to="360 19 19" dur="12s" repeatCount="indefinite"/>
      </svg>
    </div>
    <div class="logo-text">
      <h1>J.A.R.V.I.S.</h1>
      <p>Just A Rather Very Intelligent System</p>
    </div>
  </div>
  <div class="header-stats">
    <div class="stat">
      <div class="stat-label">Status</div>
      <div class="stat-value"><span class="status-dot"></span>ONLINE</div>
    </div>
    <div class="stat">
      <div class="stat-label">Model</div>
      <div class="stat-value">LLAMA 3.3</div>
    </div>
    <div class="stat">
      <div class="stat-label">Mode</div>
      <div class="stat-value">WEB</div>
    </div>
  </div>
</header>

<!-- Main -->
<div class="main">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Quick Commands</div>
      <button class="quick-btn" onclick="sendQuick('Write a Python hello world program')"><span class="icon">⌨</span> Python code</button>
      <button class="quick-btn" onclick="sendQuick('Explain machine learning in simple terms')"><span class="icon">🧠</span> Explain ML</button>
      <button class="quick-btn" onclick="sendQuick('Write a professional email template')"><span class="icon">✉</span> Email draft</button>
      <button class="quick-btn" onclick="sendQuick('Give me 5 productivity tips')"><span class="icon">⚡</span> Productivity</button>
      <button class="quick-btn" onclick="sendQuick('Debug this code and tell me what is wrong: ')"><span class="icon">🔧</span> Debug code</button>
      <button class="quick-btn" onclick="sendQuick('Write a short story about AI')"><span class="icon">📝</span> Creative write</button>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Capabilities</div>
      <button class="quick-btn" onclick="sendQuick('What can you do?')"><span class="icon">◈</span> Capabilities</button>
      <button class="quick-btn" onclick="sendQuick('Solve this math problem: ')"><span class="icon">∑</span> Mathematics</button>
      <button class="quick-btn" onclick="sendQuick('Analyse and improve my code: ')"><span class="icon">◉</span> Code review</button>
    </div>
    <div class="sys-info">
      <div class="sys-line"><span>UPTIME</span><span id="uptime">00:00:00</span></div>
      <div class="sys-line"><span>MESSAGES</span><span id="msg-count">0</span></div>
      <div class="sys-line"><span>ENGINE</span><span>GROQ</span></div>
    </div>
  </div>

  <!-- Chat -->
  <div class="chat-container">
    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <svg class="welcome-arc" viewBox="0 0 80 80" fill="none">
          <circle cx="40" cy="40" r="36" stroke="#00d4ff" stroke-width="0.8" opacity="0.3"/>
          <circle cx="40" cy="40" r="28" stroke="#00d4ff" stroke-width="0.8" opacity="0.5"/>
          <circle cx="40" cy="40" r="18" stroke="#00d4ff" stroke-width="1.5" opacity="0.8"/>
          <circle cx="40" cy="40" r="8" fill="rgba(0,212,255,0.2)" stroke="#00d4ff" stroke-width="2"/>
          <circle cx="40" cy="40" r="3" fill="#00d4ff"/>
          <line x1="40" y1="4" x2="40" y2="14" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
          <line x1="40" y1="66" x2="40" y2="76" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
          <line x1="4" y1="40" x2="14" y2="40" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
          <line x1="66" y1="40" x2="76" y2="40" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
        </svg>
        <h2>J.A.R.V.I.S.</h2>
        <p>Good day. All systems are online and operational. How may I assist you?</p>
        <div class="welcome-chips">
          <button class="chip" onclick="sendQuick('Write me a Python web scraper')">Write code</button>
          <button class="chip" onclick="sendQuick('Explain quantum computing simply')">Explain anything</button>
          <button class="chip" onclick="sendQuick('Fix this bug: ')">Fix bugs</button>
          <button class="chip" onclick="sendQuick('Help me plan a project')">Plan a project</button>
          <button class="chip" onclick="sendQuick('What are the latest trends in AI?')">AI trends</button>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrapper">
        <textarea
          id="input"
          placeholder="Enter command or query..."
          rows="1"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"
        ></textarea>
        <button class="clear-btn" onclick="clearChat()" title="Clear conversation">✕</button>
        <button class="send-btn" id="send-btn" onclick="sendMessage()" title="Send (Enter)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <div class="input-hint">ENTER to send &nbsp;·&nbsp; SHIFT+ENTER for new line</div>
    </div>
  </div>
</div>

<script>
const SESSION_ID = Math.random().toString(36).slice(2);
let msgCount = 0;
let startTime = Date.now();
let isStreaming = false;

// Uptime counter
setInterval(() => {
  const s = Math.floor((Date.now() - startTime) / 1000);
  const h = String(Math.floor(s/3600)).padStart(2,'0');
  const m = String(Math.floor((s%3600)/60)).padStart(2,'0');
  const sc = String(s%60).padStart(2,'0');
  document.getElementById('uptime').textContent = `${h}:${m}:${sc}`;
}, 1000);

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

function sendQuick(text) {
  document.getElementById('input').value = text;
  autoResize(document.getElementById('input'));
  document.getElementById('input').focus();
}

function clearChat() {
  fetch('/clear', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({session_id: SESSION_ID})
  });
  const msgs = document.getElementById('messages');
  msgs.innerHTML = '';
  msgCount = 0;
  document.getElementById('msg-count').textContent = 0;
  // Restore welcome
  const welcome = document.createElement('div');
  welcome.className = 'welcome';
  welcome.id = 'welcome';
  welcome.innerHTML = `
    <svg class="welcome-arc" viewBox="0 0 80 80" fill="none">
      <circle cx="40" cy="40" r="36" stroke="#00d4ff" stroke-width="0.8" opacity="0.3"/>
      <circle cx="40" cy="40" r="28" stroke="#00d4ff" stroke-width="0.8" opacity="0.5"/>
      <circle cx="40" cy="40" r="18" stroke="#00d4ff" stroke-width="1.5" opacity="0.8"/>
      <circle cx="40" cy="40" r="8" fill="rgba(0,212,255,0.2)" stroke="#00d4ff" stroke-width="2"/>
      <circle cx="40" cy="40" r="3" fill="#00d4ff"/>
    </svg>
    <h2>J.A.R.V.I.S.</h2>
    <p>Conversation cleared. Ready for new commands.</p>`;
  msgs.appendChild(welcome);
}

function addMessage(role, content) {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `message ${role}`;

  const avatar = role === 'user'
    ? '<div class="msg-avatar">◈</div>'
    : `<div class="msg-avatar"><svg width="16" height="16" viewBox="0 0 38 38" fill="none"><circle cx="19" cy="19" r="8" stroke="#00d4ff" stroke-width="1.5"/><circle cx="19" cy="19" r="4" fill="#00d4ff" opacity="0.8"/></svg></div>`;

  const label = role === 'user' ? 'YOU' : 'J.A.R.V.I.S.';

  div.innerHTML = `
    ${avatar}
    <div class="msg-body">
      <div class="msg-label">${label}</div>
      <div class="msg-content" id="msg-${Date.now()}"></div>
    </div>`;

  msgs.appendChild(div);
  const contentEl = div.querySelector('.msg-content');
  if (content) contentEl.innerHTML = formatMessage(content);
  msgs.scrollTop = msgs.scrollHeight;
  return contentEl;
}

function formatMessage(text) {
  // Code blocks
  text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) =>
    `<pre><code>${escapeHtml(code.trim())}</code></pre>`);
  // Inline code
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold
  text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  // Line breaks
  text = text.replace(/\n/g, '<br>');
  return text;
}

function escapeHtml(text) {
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function addTyping() {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'typing-indicator';
  div.id = 'typing';
  div.innerHTML = `
    <div class="msg-avatar"><svg width="16" height="16" viewBox="0 0 38 38" fill="none"><circle cx="19" cy="19" r="8" stroke="#00d4ff" stroke-width="1.5"/><circle cx="19" cy="19" r="4" fill="#00d4ff" opacity="0.8"/></svg></div>
    <div class="typing-dots"><span></span><span></span><span></span></div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

async function sendMessage() {
  if (isStreaming) return;
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;

  isStreaming = true;
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('send-btn').disabled = true;

  addMessage('user', text);
  msgCount++;
  document.getElementById('msg-count').textContent = msgCount;

  addTyping();

  try {
   try {
    const response = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({message: text, session_id: SESSION_ID})
    });

    const typing = document.getElementById('typing');
    if (typing) typing.remove();

    const data = await response.json();
    const contentEl = addMessage('jarvis', '');
    contentEl.innerHTML = formatMessage(data.reply);
    msgCount++;
    document.getElementById('msg-count').textContent = msgCount;
    document.getElementById('messages').scrollTop = 99999;

  } catch (e) {
    const typing = document.getElementById('typing');
    if (typing) typing.remove();
    addMessage('jarvis', 'System error. Please check API key configuration.');
  }

    const typing = document.getElementById('typing');
    if (typing) typing.remove();

    const contentEl = addMessage('jarvis', '');
    msgCount++;
    document.getElementById('msg-count').textContent = msgCount;

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let fullText = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      const lines = decoder.decode(value).split('\n');
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          try {
            const data = JSON.parse(line.slice(6));
            if (data.delta) {
              fullText += data.delta;
              contentEl.innerHTML = formatMessage(fullText);
              document.getElementById('messages').scrollTop = 99999;
            }
          } catch {}
        }
      }
    }
  } catch (e) {
    const typing = document.getElementById('typing');
    if (typing) typing.remove();
    addMessage('jarvis', 'System error. Please check your API key configuration.');
  }

  isStreaming = false;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('input').focus();
}

document.getElementById('input').focus();
</script>
